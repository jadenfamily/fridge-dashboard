<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>냉장고 파먹기</title>
<style>
  :root{
    --ink:#2c2440;
    --ink-2:#6d6484;
    --line:#f1e6da;
    --card:#ffffff;
    --shadow:0 10px 26px rgba(118,86,54,.10), 0 2px 6px rgba(118,86,54,.05);
    --r-lg:26px;
    --sun:#ff9f1c;
    --mint:#10b981;
    --grape:#7c5cfc;
    --pink:#ff5c8a;
    --sky:#3d9be9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "맑은 고딕", system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); font-size:16px; line-height:1.45; min-height:100vh;
    background-color:#f4fbff;
    background-image:
      radial-gradient(circle at 8% -6%, #dff4ff 0, rgba(223,244,255,0) 46%),
      radial-gradient(circle at 92% -2%, #ffe9d6 0, rgba(255,233,214,0) 44%),
      radial-gradient(circle at 50% 112%, #f0e9ff 0, rgba(240,233,255,0) 46%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; }
  select,input{ font-family:inherit; }
  h1,h2,h3,p{ word-break:keep-all; }
  a{ color:#2f6fb5; }

  .app{
    max-width:1280px; margin:0 auto;
    padding:clamp(14px,2vw,26px) clamp(14px,2.4vw,30px) 44px;
    display:flex; flex-direction:column; gap:clamp(12px,1.5vw,18px);
  }

  /* ---------- 상단 ---------- */
  .topbar{ display:flex; align-items:stretch; gap:10px; flex-wrap:wrap; }
  .brand{
    flex:1 1 300px; min-height:64px; border-radius:20px; padding:7px 13px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
    background:linear-gradient(135deg,#e6f7ff 0%,#eef2ff 55%,#fff4e6 100%);
    display:flex; align-items:center; gap:11px;
  }
  .brand::after{
    content:'🧊'; position:absolute; right:-2px; bottom:-16px; font-size:66px;
    opacity:.12; transform:rotate(-8deg); pointer-events:none;
  }
  .brand-text{ min-width:0; position:relative; z-index:1; }
  .brand h1{ margin:0; font-size:clamp(17px,1.9vw,21px); font-weight:900; letter-spacing:-.025em; line-height:1.2; }
  .brand-sub{ margin:3px 0 0; font-size:11.5px; font-weight:800; color:var(--ink-2); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .brand-sub .dot{ opacity:.5; }
  .hub-btn{
    flex:0 0 auto; border:none; border-radius:12px; min-height:38px; padding:0 11px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px; text-decoration:none;
    background:#fff; color:#0d6b52; font-size:12px; font-weight:900; box-shadow:0 3px 10px rgba(118,86,54,.10);
    touch-action:manipulation; position:relative; z-index:1;
  }
  .hub-btn:active{ transform:scale(.97); }
  .actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .edit-btn{
    border:none; border-radius:13px; min-height:38px; padding:0 12px; cursor:pointer;
    background:#fff; color:#5b4a7a; font-size:12.5px; font-weight:900; box-shadow:var(--shadow);
    touch-action:manipulation;
  }
  .edit-btn:active{ transform:scale(.97); }
  .edit-btn.on{ background:#2c2440; color:#fff; }
  .sync-pill{
    font-size:11.5px; font-weight:900; padding:5px 10px; border-radius:999px; white-space:nowrap;
    background:#fff; color:#8a7f70;
  }
  .sync-pill.ok{ background:#eefaf3; color:#0f7a55; }
  .sync-pill.sync{ background:#eef5ff; color:#2f6fb5; }
  .sync-pill.off{ background:#fff4e6; color:#b0610b; }
  .sync-pill.err{ background:#fff0f3; color:#c6415a; }
  .user-chip{ display:flex; align-items:center; gap:7px; background:#fff; border-radius:13px; padding:3px 8px 3px 3px; box-shadow:var(--shadow); }
  .uc-av{ width:28px; height:28px; border-radius:10px; flex:0 0 auto; display:grid; place-items:center; background:linear-gradient(135deg,#cdefff,#ffd9e8); font-size:13px; font-weight:900; color:#0b5d7a; }
  .uc-meta{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
  .uc-meta b{ font-size:12px; font-weight:900; white-space:nowrap; }
  .uc-role{ font-size:10.5px; font-weight:900; color:#a2937f; }
  .ro-pill{ font-size:11.5px; font-weight:900; padding:6px 11px; border-radius:999px; background:#f3ecff; color:#5b3fa8; }

  /* ---------- 카드 공통 ---------- */
  .card{ background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:clamp(13px,1.5vw,18px); }
  .card-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:11px; }
  .card-head h2{ margin:0; font-size:clamp(16px,1.7vw,20px); font-weight:900; letter-spacing:-.02em; }
  .card-head h2 .count{ display:inline-grid; place-items:center; min-width:24px; height:24px; padding:0 7px; border-radius:999px; background:#ffefef; color:#c6415a; font-size:12.5px; vertical-align:1px; }
  .head-note{ margin-left:auto; font-size:11.5px; font-weight:800; color:#a99c8c; }
  .btn{
    border:none; border-radius:13px; min-height:44px; padding:0 15px; cursor:pointer;
    background:linear-gradient(135deg,#ffd43b,#ff9f1c); color:#5a3200; font-size:13.5px; font-weight:900;
    touch-action:manipulation; white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.sub{ background:#f1f6ff; color:#2f5f92; }
  .btn.ghost{ background:#f7f1e9; color:#7a6a55; }
  .btn.sm{ min-height:38px; padding:0 12px; font-size:12.5px; }
  .btn.xs{ min-height:34px; padding:0 10px; font-size:12px; }
  .btn.wide{ width:100%; min-height:52px; font-size:15.5px; }
  .link-btn{ border:none; background:none; color:#7c6aa8; font-size:12.5px; font-weight:900; text-decoration:underline; cursor:pointer; padding:4px; }
  .note{ margin:0; font-size:11.5px; font-weight:700; color:#a99c8c; line-height:1.6; }
  .empty{ padding:22px 12px; text-align:center; font-size:13px; font-weight:800; color:#a99c8c; }

  /* ---------- 월 식비 (압축 바) ---------- */
  .budget{ padding:8px 12px 7px; }
  .bud-head{ display:flex; align-items:center; gap:7px; flex-wrap:nowrap; }
  .bud-title{ flex:0 0 auto; font-size:12px; font-weight:900; color:#6d6484; white-space:nowrap; }
  .bud-title .bud-sub{ margin-left:2px; font-size:10.5px; font-weight:800; color:#a99c8c; }
  .bud-fig{ margin-left:auto; font-size:11px; font-weight:900; color:#a99c8c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bud-fig b{ font-size:clamp(16px,1.9vw,19px); font-weight:900; color:var(--ink); letter-spacing:-.03em; }
  .bud-fig b.over{ color:#c6415a; }
  .bud-bar{ margin:5px 0 4px; height:8px; border-radius:999px; background:#f4eee6; overflow:hidden; }
  .bud-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,#5ac8fa,#7c5cfc); transition:width .4s ease; }
  .bud-fill.over{ background:linear-gradient(90deg,#ff9f1c,#ff5c8a); }
  .bud-foot{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:10.5px; font-weight:800; color:#8a93a8; line-height:1.2; }
  .bud-detail{ margin-left:auto; color:#a99c8c; }
  .bud-btns{ flex:0 0 auto; display:flex; gap:4px; }
  .bud-btns .btn{ min-height:26px; padding:0 8px; font-size:11px; border-radius:8px; }
  @media (max-width:430px){ .bud-detail{ display:none; } }

  /* ---------- 섹션 탭 ---------- */
  .tabs{
    position:sticky; top:0; z-index:45; display:flex; gap:6px; overflow-x:auto;
    padding:7px 2px 8px; margin:-2px -2px 0; background:rgba(244,251,255,.94);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; border:2px solid #e9eff7; background:#fff; color:#5c6b80; border-radius:999px;
    min-height:38px; padding:0 12px; font-size:12.5px; font-weight:900; cursor:pointer;
    touch-action:manipulation; white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
    box-shadow:0 2px 6px rgba(118,86,54,.05); font-family:inherit;
  }
  .tab b{ font-size:10.5px; font-weight:900; color:#8a7f70; background:#f2ece4; border-radius:999px; padding:1px 6px; }
  .tab.on{ background:linear-gradient(135deg,#8ed8ff,#7c5cfc); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(90,120,200,.24); }
  .tab.on b{ background:rgba(255,255,255,.28); color:#fff; }
  .tab:active{ transform:scale(.97); }

  /* ---------- 장보기 알림 ---------- */
  .shopping{ background:linear-gradient(150deg,#fff6f6,#fff9ee); border:2px solid #ffe1e1; }
  .shop-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:6px; }
  .shop-row{ display:flex; align-items:center; gap:8px; background:#fff; border-radius:14px; padding:7px 9px; flex-wrap:wrap; }
  .shop-main{ display:flex; flex-direction:column; min-width:0; flex:1 1 auto; }
  .shop-main b{ font-size:13.5px; font-weight:900; }
  .shop-main span{ font-size:11px; font-weight:800; color:#c6415a; }
  .shop-row .btn{ margin-left:auto; }
  .shop-more{ display:none; width:100%; margin-top:8px; min-height:40px; border:2px dashed #f0d8d8; background:#fff; color:#b0610b; border-radius:12px; font-size:12.5px; font-weight:900; cursor:pointer; }
  .shop-head-btns{ margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .shop-empty{ padding:6px 2px 2px; font-size:12px; font-weight:800; color:#a2937f; line-height:1.55; }
  .shop-status{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; font-weight:800; color:#a2937f; margin:2px 0 7px; }
  .watch-list{ margin-top:9px; border-top:2px dashed #f4e0e0; padding-top:8px; display:flex; flex-direction:column; gap:5px; max-height:340px; overflow:auto; }
  .watch-cap{ font-size:11.5px; font-weight:900; color:#b0610b; }
  .watch-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:#fff; border:2px solid #f7ece4; border-radius:12px; padding:5px 8px; }
  .watch-row.off{ background:#fbf7f4; }
  .watch-main{ flex:1 1 110px; min-width:0; display:flex; flex-direction:column; }
  .watch-main b{ font-size:12.5px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .watch-main span{ font-size:10.5px; font-weight:800; color:#a2937f; }
  .watch-row .act-pill{ height:28px; padding:0 8px; }
  .watch-row .act-pill.on{ background:#eefaf3; color:#0f7a55; }

  /* ---------- 식재료 ---------- */
  .inv-tools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .search{
    flex:1 1 200px; min-height:46px; padding:9px 14px; border-radius:14px; border:2px solid #e6dccf;
    background:#fffdf9; font-size:14px; font-weight:800; color:var(--ink);
  }
  .search:focus{ outline:none; border-color:#74c7ff; box-shadow:0 0 0 4px rgba(116,199,255,.18); }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    border:2px solid #e9eff7; background:#fff; color:#5c6b80; border-radius:999px; min-height:40px; padding:0 12px;
    font-size:12.5px; font-weight:900; cursor:pointer; touch-action:manipulation;
  }
  .chip b{ color:#a99c8c; margin-left:2px; }
  .chip.on{ background:#e8f5ff; border-color:#a8dbff; color:#125e86; }
  .chip.on b{ color:#125e86; }
  .seg{ display:flex; background:#f4f0ea; border-radius:12px; padding:3px; gap:2px; }
  .seg button{ border:none; background:none; border-radius:9px; min-height:36px; padding:0 11px; font-size:12.5px; font-weight:900; color:#8a7f70; cursor:pointer; }
  .seg button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,.07); }
  .sel{
    min-height:42px; padding:4px 10px; border-radius:12px; border:2px solid #e6dccf; background:#fffdf9;
    font-size:13px; font-weight:900; color:var(--ink);
  }
  .tool-btns{ display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; }
  .inv-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
  .item{
    display:flex; flex-direction:column; gap:3px; min-width:0;
    border:2px solid #f5ede2; background:#fffdf9; border-radius:14px; padding:6px 9px;
  }
  .item.out{ background:#fbf9f6; border-style:dashed; }
  .item.out .it-name{ color:#a99c8c; text-decoration:line-through; }
  .st-badge{ flex:0 0 auto; font-size:10.5px; font-weight:900; padding:4px 8px; border-radius:999px; }
  .st-frozen{ background:#e8f2ff; color:#1f5fa8; }
  .st-fridge{ background:#e2f8ff; color:#0b6b86; }
  .st-room{ background:#fff3dd; color:#9a5b00; }
  .st-sauce{ background:#f3ecff; color:#5b3fa8; }
  .it-l1{ display:flex; align-items:center; gap:5px; min-width:0; }
  .it-l1 .st-badge{ padding:2px 7px; font-size:10px; }
  .it-name{ font-size:13.5px; font-weight:900; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .it-date{ flex:0 0 auto; font-size:10.5px; font-weight:800; color:#a2937f; white-space:nowrap; }
  .it-price{ flex:0 0 auto; margin-left:auto; font-size:10.5px; font-weight:900; color:#8a7f70; white-space:nowrap; }
  .star{ flex:0 0 auto; font-size:11px; color:#f6a600; }
  .out-pill{ flex:0 0 auto; font-size:9.5px; font-weight:900; padding:2px 6px; border-radius:999px; background:#f3ecff; color:#5b3fa8; }
  .it-l2{ display:flex; align-items:center; gap:4px; min-width:0; }
  .it-qty{ display:flex; align-items:center; gap:2px; flex:0 0 auto; background:#f7f6f2; border-radius:10px; padding:2px; }
  .qbtn{ width:26px; height:26px; border:none; border-radius:8px; background:#fff; color:#5b4a7a; font-size:14px; font-weight:900; cursor:pointer; touch-action:manipulation; line-height:1; }
  .qv{ min-width:36px; text-align:center; font-size:12px; font-weight:900; }
  .it-acts{ display:flex; align-items:center; gap:3px; margin-left:auto; flex-wrap:nowrap; }
  .act-pill{ border:none; border-radius:8px; height:26px; padding:0 7px; font-size:11px; font-weight:900; background:#f7f1e9; color:#7a6a55; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
  .act-pill.use{ background:#eefaf3; color:#0f7a55; }
  .act-pill.back{ background:#eef5ff; color:#2f6fb5; }
  .act-pill.on{ background:#fff3d6; color:#b0610b; }
  .ic-btn{ width:32px; height:32px; border:none; border-radius:10px; background:#f7f1e9; font-size:14px; cursor:pointer; touch-action:manipulation; }
  .ic-btn.on{ background:#fff3d6; }
  .use-btn{ background:#eefaf3; color:#0f7a55; }
  .item.out .use-btn{ background:#eef5ff; color:#2f6fb5; }
  .restore{ background:#eef5ff; color:#2f6fb5; }

  /* ---------- 레시피 ---------- */
  .recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:9px; }
  .rc{ display:flex; gap:10px; border:2px solid #f5ede2; background:#fffdf9; border-radius:18px; padding:11px 12px; }
  .rc-emoji{ font-size:26px; line-height:1; flex:0 0 auto; }
  .rc-body{ min-width:0; flex:1 1 auto; }
  .rc-title{ display:flex; align-items:center; gap:7px; }
  .rc-title b{ font-size:14.5px; font-weight:900; }
  .pct{ margin-left:auto; font-size:11.5px; font-weight:900; padding:3px 8px; border-radius:999px; background:#eefaf3; color:#0f7a55; white-space:nowrap; }
  .pct.low{ background:#fff4e6; color:#b0610b; }
  .rc-desc{ margin:4px 0 0; font-size:11.5px; font-weight:700; color:#8a93a8; line-height:1.5; }
  .rc-ing{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .rc-ing span{ font-size:10.5px; font-weight:900; padding:3px 7px; border-radius:999px; background:#f1f7ee; color:#3f7a4f; }
  .rc-ing span.miss{ background:#f6f1ea; color:#a99c8c; border:1px dashed #e6dccf; }
  .more-row{ display:flex; justify-content:center; margin-top:10px; }
  .ai-box{ margin-top:14px; border-top:2px dashed #f0e4d6; padding-top:13px; }
  .ai-head{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
  .ai-head b{ font-size:15px; font-weight:900; }
  .ai-at{ font-size:11.5px; font-weight:800; color:#a99c8c; }
  .ai-head .btn{ margin-left:auto; }
  .ai-empty{ font-size:12.5px; font-weight:700; color:#8a93a8; background:#f8fbff; border-radius:14px; padding:12px 13px; line-height:1.6; }
  .ai-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:9px; }
  .ai-card{ background:linear-gradient(160deg,#fbf7ff,#f4fbff); border:2px solid #efe6ff; border-radius:18px; padding:12px 13px; }
  .ai-card-head{ display:flex; align-items:center; gap:8px; }
  .ai-card-head b{ font-size:14.5px; font-weight:900; }
  .ai-card-head span{ margin-left:auto; font-size:11px; font-weight:900; color:#7c6aa8; }
  .ai-why{ margin:5px 0 0; font-size:11.5px; font-weight:800; color:#8a7fa8; line-height:1.55; }
  .ai-steps{ margin:7px 0 0; padding-left:17px; font-size:11.5px; font-weight:700; color:#6d6484; line-height:1.6; }
  .rc-links{ display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
  .lnk{
    display:inline-flex; align-items:center; gap:3px; border:none; border-radius:999px; padding:4px 9px;
    font-size:10.5px; font-weight:900; text-decoration:none; background:#f4f1ff; color:#5b3fa8;
    cursor:pointer; white-space:nowrap; line-height:1.3; font-family:inherit; touch-action:manipulation;
  }
  .lnk.yt{ background:#fff0f0; color:#c6415a; }
  .lnk.sh{ background:#fff6e8; color:#b0610b; }
  .lnk.ref{ background:#eef5ff; color:#2f6fb5; }
  .lnk.add{ background:#f7f7fb; color:#5d6880; border:1px dashed #d6dfec; }
  .lnk:active{ transform:scale(.97); }

  /* ---------- 주간 식단 ---------- */
  .week-nav{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .week-nav button{ width:38px; height:38px; border:none; border-radius:11px; background:#f1f6ff; color:#2f5f92; font-size:17px; font-weight:900; cursor:pointer; }
  .week-nav span{ font-size:13px; font-weight:900; min-width:110px; text-align:center; }
  .week-range{ margin:-4px 0 10px; font-size:12px; font-weight:800; color:#a99c8c; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .meal-grid{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .meal-day{ border:2px solid #f5ede2; border-radius:18px; background:#fffdf9; padding:9px; display:flex; flex-direction:column; gap:6px; }
  .meal-day.today{ border-color:#ffd98a; background:#fffbf0; }
  .md-head{ display:flex; align-items:baseline; gap:6px; padding:0 2px 3px; }
  .md-head b{ font-size:14px; font-weight:900; }
  .md-head span{ font-size:11px; font-weight:800; color:#a99c8c; }
  .md-head .today-chip{ margin-left:auto; font-size:10px; font-weight:900; color:#b0610b; background:#fff2d4; border-radius:999px; padding:2px 7px; }
  .mslot{
    text-align:left; border:2px solid #f2f6fb; background:#fff; border-radius:12px; padding:6px 9px;
    display:flex; flex-direction:column; gap:1px; justify-content:center; cursor:pointer; touch-action:manipulation; min-height:56px;
  }
  .meal-day .mslot{ flex:1 1 auto; }
  .mslot b{ font-size:10.5px; font-weight:900; color:#8a93a8; }
  .mslot span{ font-size:12.5px; font-weight:800; color:var(--ink); line-height:1.35; }
  .mslot span.empty{ color:#c4bcae; font-weight:700; }
  .mslot div{ min-height:52px; }
  .meal-readonly .mslot{ cursor:default; }

  /* ============ GitHub API ============ */
  function ghHeaders(token) {
    return {
      'Authorization': 'Bearer ' + (token || (cloud.conn && cloud.conn.token) || ''),

  function b64encodeUtf8(str) {
    var bytes = new TextEncoder().encode(String(str));
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return window.btoa(bin);

  async function ghGet(path) {
    if (!cloud.conn) return { ok: false, status: 0, error: '연결 전' };
    var branch = cloud.conn.branch || 'main';
    var url = ghBase() + '/contents/' + path + '?ref=' + encodeURIComponent(branch) + '&_=' + Date.now();
    try {
      var res = await window.fetch(url, { headers: ghHeaders(), cache: 'no-store' });
      if (res.status === 404) return { ok: true, missing: true };
      if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
      if (res.status === 403) return { ok: false, status: 403, error: '권한이 없어요 (Contents: Read and write)' };
      if (!res.ok) return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      var j = await res.json();
      if (Object.prototype.toString.call(j) === '[object Array]') return { ok: true, list: j };
      var text = j && j.content ? b64decodeUtf8(j.content) : '';
      var data = null;
      if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
      rememberSha(path, j && j.sha);
      return { ok: true, data: data, sha: j && j.sha, raw: text };
    } catch (e) {
      return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
    }
  }

  async function ghPut(path, obj, message) {
    if (!cloud.conn) return { ok: false, status: 0, error: '연결 전' };
    var payload = {
      message: message || ('냉장고 대시보드: ' + path),
      content: b64encodeUtf8(JSON.stringify(obj, null, 2)),
      branch: cloud.conn.branch || 'main'
    };
    if (cloud.sha[path]) payload.sha = cloud.sha[path];
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var res = await window.fetch(ghBase() + '/contents/' + path, { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(payload) });
        if (res.ok) {
          var j = await res.json();
          rememberSha(path, j && j.content && j.content.sha);
          return { ok: true };
        }
        if (res.status === 409 || res.status === 422 || res.status === 404) {
          var cur = await ghGet(path);
          if (!cur.ok) return { ok: false, status: cur.status, error: cur.error };
          if (cur.missing) delete payload.sha; else payload.sha = cur.sha;
          continue;
        }
        if (res.status === 401) return { ok: false, status: 401, error: '토큰이 올바르지 않아요' };
        if (res.status === 403) return { ok: false, status: 403, error: '쓰기 권한이 없어요' };
        return { ok: false, status: res.status, error: 'HTTP ' + res.status };
      } catch (e) {
        return { ok: false, status: 0, error: '네트워크에 연결하지 못했어요' };
      }
    }
    return { ok: false, status: 409, error: '다른 기기에서 먼저 저장했어요' };
  }

    if (cloud.status === 'offline') { el.className = 'sync-pill off'; el.textContent = '📴 오프라인 · 기기에 저장'; return; }
    if (cloud.status === 'error') { el.className = 'sync-pill err'; el.textContent = '⚠️ 동기화 오류'; return; }
    if (cloud.status === 'syncing') { el.className = 'sync-pill sync'; el.textContent = '☁️ 저장 중…'; return; }
    if (cloud.status === 'ok') {
      el.className = 'sync-pill ok';
      var d = new Date(cloud.statusAt || Date.now());
      el.textContent = '☁️ 저장됨 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      return;
    }
    el.className = 'sync-pill';
    el.textContent = '☁️ 준비';
  }
  function syncPillTail() { /* settings의 저장 상태 줄도 같이 갱신 */
    var si = $('syncInfo');
    if (si) si.textContent = syncText();
  }
  function markDirty(kind) {
    if (kind === 'inventory') cloud.dirty.inventory = true;
    if (kind === 'meals') cloud.dirty.meals = true;
    if (kind === 'settings') cloud.dirty.settings = true;
    if (kind === 'daily') cloud.dirty.daily = true;
    saveLocal();
    renderSyncPill();
    scheduleSync();
  }
  function scheduleSync() {
    if (!cloud.conn || !cloud.me) return;
    if (cloud.timer) window.clearTimeout(cloud.timer);
    cloud.timer = window.setTimeout(function () { cloud.timer = 0; flushSync(); }, 900);
  }
  async function flushSync() {
    if (!cloud.conn || !cloud.me || cloud.saving) return;
    if (!anyDirty()) { return; }
    cloud.saving = true;
    setSync('syncing');
    var jobs = [];
    if (cloud.dirty.inventory) jobs.push({ kind: 'inventory', path: PATH_INV, obj: { version: 1, updatedAt: nowIso(), items: state.inventory.items } });
    if (cloud.dirty.meals) jobs.push({ kind: 'meals', path: PATH_MEALS, obj: { version: 1, updatedAt: nowIso(), budget: state.meals.budget, weeks: state.meals.weeks, expenses: state.meals.expenses } });
    if (cloud.dirty.settings) jobs.push({ kind: 'settings', path: PATH_SET, obj: { version: 1, updatedAt: nowIso(), recipes: state.settings.recipes, recipesAt: state.settings.recipesAt, prefs: state.settings.prefs, links: state.settings.links, sectionOrder: state.settings.sectionOrder, sectionTitles: state.settings.sectionTitles } });
    if (cloud.dirty.daily) jobs.push({ kind: 'daily', path: PATH_DAILY, obj: { version: 1, updatedAt: nowIso(), days: state.daily.days } });
    var failed = null;
    for (var i = 0; i < jobs.length; i++) {
      var job = jobs[i];
      var r = await ghPut(job.path, job.obj, '냉장고 대시보드 저장: ' + job.kind);
      if (r.ok) {
        cloud.dirty[job.kind] = false;
        state[job.kind].updatedAt = job.obj.updatedAt;
      } else {
        failed = r;
        break;
      }
    }
    cloud.saving = false;
    saveLocal();
    if (failed) {
      setSync(navigator.onLine === false ? 'offline' : 'error');
      if (failed.status === 401 || failed.status === 403) toast('저장 권한이 없어요. 가족 허브에서 기기를 다시 연결해 주세요.', true);
    } else {
      setSync(navigator.onLine === false ? 'offline' : 'ok');
    }
    if (anyDirty()) scheduleSync();
    syncPillTail();
  }

  /* ============ 주 / 날짜 ============ */
  function mondayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = x.getDay(); // 0=일
    var diff = (day === 0 ? -6 : 1 - day);
    x.setDate(x.getDate() + diff);
    return x;
  }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function isoWeekKey(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = t.getUTCFullYear();
    var w = Math.ceil((((t - Date.UTC(y, 0, 1)) / 86400000) + 1) / 7);
    return y + '-W' + pad2(w);
  }
  function weekLabel(start) {
    var mon = parseYmd(start);
    if (!mon) return '';
    var weekOfMonth = Math.ceil(mon.getDate() / 7);
    var fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4);
    return (mon.getMonth() + 1) + '월 ' + weekOfMonth + '주차';
  }
  function weekRange(start) {
    var mon = parseYmd(start);
    if (!mon) return '';
    var fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4);
    return (mon.getMonth() + 1) + '/' + mon.getDate() + '(' + DAYS[0].n + ') ~ ' + (fri.getMonth() + 1) + '/' + fri.getDate() + '(' + DAYS[4].n + ')';
  }
  function dayDate(start, i) {
    var mon = parseYmd(start);
    if (!mon) return null;
    return new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
  }

  /* ============ 식재료 계산 ============ */
  function inStock(items) { return items.filter(function (i) { return i.status === 'in' && num(i.qty) > 0; }); }
  function needsShopping() {
    return state.inventory.items.filter(function (it) {
      return it.staple && it.alert !== false && (it.status !== 'in' || num(it.qty) < (num(it.minQty) || 1));
    });
  }
  function watchItems() {
    return state.inventory.items.filter(function (it) { return !!it.staple; });
  }
  function findItem(id) {
    for (var i = 0; i < state.inventory.items.length; i++) if (state.inventory.items[i].id === id) return state.inventory.items[i];
    return null;
  }
  /* 같은 이름의 '소진된' 항목이 있으면 새로 만들지 않고 재입고로 합쳐요 (장보기 알림이 바로 풀리도록) */
  function upsertItem(data) {
    var n = norm(data.name);
    var hit = null;
    for (var i = 0; i < state.inventory.items.length; i++) {
      var it = state.inventory.items[i];
      if (it.status === 'out' && norm(it.name) === n) { hit = it; break; }
    }
    if (hit) {
      hit.qty = Math.max(0, num(hit.qty)) + Math.max(0, num(data.qty));
      hit.status = hit.qty > 0 ? 'in' : 'out';
      if (isYmd(data.boughtAt)) hit.boughtAt = data.boughtAt;
      if (num(data.price) > 0) hit.price = Math.round(num(data.price));
      if (data.unit) hit.unit = data.unit;
      if (data.staple) hit.staple = true;
      hit.updatedAt = Date.now();
      return hit;
    }
    var added = makeItem(data);
    state.inventory.items.push(added);
    return added;
  }
  function monthSpent() {
    var m = todayStr().slice(0, 7), inv = 0, exp = 0, i;
    for (i = 0; i < state.inventory.items.length; i++) {
      var it = state.inventory.items[i];
      if (it.price > 0 && String(it.boughtAt).slice(0, 7) === m) inv += it.price;
    }
    for (i = 0; i < state.meals.expenses.length; i++) {
      var e = state.meals.expenses[i];
      if (String(e.date).slice(0, 7) === m) exp += num(e.amount);
    }
    return { inv: inv, exp: exp, total: inv + exp };
  }
  function storageCounts() {
    var c = { frozen: 0, fridge: 0, room: 0, sauce: 0 };
    for (var i = 0; i < state.inventory.items.length; i++) {
      var it = state.inventory.items[i];
      if (it.status === 'in' && num(it.qty) > 0) c[it.storage] = (c[it.storage] || 0) + 1;
    }
    return c;
  }

  function sortedItems(list) {
    var arr = list.slice();

      arr.sort(function (a, b) { return String(a.boughtAt || '9999-12-31').localeCompare(String(b.boughtAt || '9999-12-31')) || (a.createdAt - b.createdAt); });
    } else if (ui.sort === 'name') {

      arr.sort(function (a, b) { return num(a.qty) - num(b.qty) || a.name.localeCompare(b.name, 'ko'); });
    } else {
      arr.sort(function (a, b) { return String(b.boughtAt || '').localeCompare(String(a.boughtAt || '')) || (b.createdAt - a.createdAt); });
    }

      if (ui.status === 'out' && it.status !== 'out') return false;
      if (q && norm(it.name).indexOf(q) < 0) return false;
      return true;
    });
    return sortedItems(list);

  var SECTIONS = [
    { k: 'shop', name: '🛒 장보기 필요', short: '🛒 장보기' },
    { k: 'inv', name: '🥕 식재료', short: '🥕 식재료' },
    { k: 'recipe', name: '🍳 만들 수 있는 레시피', short: '🍳 레시피' },
    { k: 'meal', name: '🍽 주간 식단', short: '📅 주간 식단' }
  ];
  var SEC_KEYS = ['shop', 'inv', 'recipe', 'meal'];
  function secOrder() {
    var out = [], seen = {}, i, list = state.settings.sectionOrder;
    if (Object.prototype.toString.call(list) === '[object Array]') {
      for (i = 0; i < list.length; i++) {
        var k = String(list[i] || '');
        if (SEC_KEYS.indexOf(k) >= 0 && !seen[k]) { seen[k] = 1; out.push(k); }
      }
    }
    for (i = 0; i < SEC_KEYS.length; i++) if (!seen[SEC_KEYS[i]]) out.push(SEC_KEYS[i]);
    return out;
  }
  function secDefaultName(k) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].k === k) return SECTIONS[i].name;
    return k;
  }
  function secShortName(k) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].k === k) return SECTIONS[i].short;
    return k;
  }
  function secTitle(k) {
    var t = state.settings.sectionTitles && state.settings.sectionTitles[k];
    return (typeof t === 'string' && t.trim()) ? t.trim() : secDefaultName(k);
  }
  function secTabName(k) {
    var t = state.settings.sectionTitles && state.settings.sectionTitles[k];
    return (typeof t === 'string' && t.trim()) ? t.trim() : secShortName(k);
  }
  function moveSection(k, dir) {
    var order = secOrder();
    var i = order.indexOf(k), j = i + dir;
    if (i < 0 || j < 0 || j >= order.length) return;
    var t = order[i]; order[i] = order[j]; order[j] = t;

  /* ---------- 레시피 ---------- */
  function scoreRecipes() {
    var stock = inStock(state.inventory.items).map(function (it) { return norm(it.name); }).filter(Boolean);
    var out = [];
    function has(ing) {
      var n = norm(ing);
      if (!n) return false;
      for (var i = 0; i < stock.length; i++) {
        var s = stock[i];
        if (s === n) return true;
        if (s.length >= 2 && n.indexOf(s) >= 0) return true;
        if (n.length >= 2 && s.indexOf(n) >= 0) return true;
      }
      return false;
    }
    for (var i = 0; i < RECIPES.length; i++) {
      var r = RECIPES[i], matched = 0, missing = [];
      for (var j = 0; j < r.ing.length; j++) {
        if (has(r.ing[j])) matched++;
        else missing.push(r.ing[j]);
      }
      out.push({ r: r, matched: matched, missing: missing, pct: Math.round(matched / r.ing.length * 100) });
    }
    out.sort(function (a, b) { return b.pct - a.pct || a.missing.length - b.missing.length || a.r.t.localeCompare(b.r.t, 'ko'); });
    return out;
  }

  /* ============ 하루 기록 / 통계 ============ */
  function fmtShort(n) {
    n = Math.round(num(n));
    if (!n) return '';
    if (n >= 100000000) return (Math.round(n / 10000000) / 10) + '억';
    if (n >= 10000) return (Math.round(n / 1000) / 10) + '만';
    if (n >= 1000) return (Math.round(n / 100) / 10) + '천';
    return String(n);
  }
  function dayRec(key, create) {
    if (!isYmd(key)) return null;
    var d = state.daily.days[key];
    if (!d && create) {
      d = { bought: [], consumed: [], meals: { b: '', l: '', d: '' }, spend: 0, stockCount: 0, updatedAt: 0 };
      state.daily.days[key] = d;
    }
    return d || null;
  }
  function mealsForDate(key) {
    var empty = { b: '', l: '', d: '' };
    var dt = parseYmd(key);
    if (!dt) return empty;
    for (var wk in state.meals.weeks) {
      if (!Object.prototype.hasOwnProperty.call(state.meals.weeks, wk)) continue;
      var w = state.meals.weeks[wk] || {};
      var mon = parseYmd(w.start);
      if (!mon) continue;
      for (var i = 0; i < DAYS.length; i++) {
        var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
        if (ymd(d) === key) {
          var s = (w.days && w.days[DAYS[i].k]) || {};
          return { b: String(s.b || ''), l: String(s.l || ''), d: String(s.d || '') };
        }
      }
    }
    return empty;
  }
  function mealCount(m) {
    if (!m) return 0;
    var n = 0;
    if (m.b) n++;
    if (m.l) n++;
    if (m.d) n++;
    return n;
  }
  function spendForDate(key) {
    var s = 0, i;
    for (i = 0; i < state.inventory.items.length; i++) {
      var it = state.inventory.items[i];
      if (it.price > 0 && it.boughtAt === key) s += it.price;
    }
    for (i = 0; i < state.meals.expenses.length; i++) {
      if (state.meals.expenses[i].date === key) s += num(state.meals.expenses[i].amount);
    }
    return s;
  }
  function derivedBought(key) {
    var out = [];
    for (var i = 0; i < state.inventory.items.length; i++) {
      var it = state.inventory.items[i];
      if (it.boughtAt === key) out.push({ name: it.name, qty: num(it.qty), unit: it.unit, price: it.price, storage: it.storage, t: it.createdAt });
    }
    return out;
  }
  function logDaily(kind, item, qty) {
    if (!item || !isYmd(todayStr())) return;
    var key = todayStr();
    var rec = dayRec(key, true);
    if (!rec) return;
    var list = kind === 'consumed' ? rec.consumed : rec.bought;
    var n = norm(item.name), hit = null;
    for (var i = 0; i < list.length; i++) if (norm(list[i].name) === n) { hit = list[i]; break; }
    var q = Math.max(0, num(qty));
    if (hit) {
      hit.qty = Math.round((num(hit.qty) + q) * 100) / 100;
      hit.t = Date.now();
    } else {
      list.push({
        name: String(item.name || '').slice(0, 40), qty: q, unit: item.unit || '개',
        price: kind === 'bought' ? Math.max(0, num(item.price)) : 0,
        storage: item.storage || 'fridge', t: Date.now()
      });
    }
    refreshDay(key, false);
    markDirty('daily');
  }
  function refreshDay(key, touch) {
    var rec = dayRec(key, true);
    if (!rec) return null;

  function dayData(key) {

    var consumed = (rec && rec.consumed) || [];
    var spend = spendForDate(key);
    var mn = mealCount(meals);
    return {
      key: key, rec: rec, bought: bought, consumed: consumed, meals: meals, mealN: mn,

  function backfillDaily() {
    var changed = false;
    var n = new Date();
    var cut = ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 200));
    function ensure(k) {
      if (!isYmd(k) || k < cut || state.daily.days[k]) return;
      state.daily.days[k] = {
        bought: derivedBought(k), consumed: [], meals: mealsForDate(k),
        spend: spendForDate(k), stockCount: 0, updatedAt: Date.now()
      };
      changed = true;
    }
    var i, w, mon, s;
    for (i = 0; i < state.inventory.items.length; i++) ensure(state.inventory.items[i].boughtAt);
    for (i = 0; i < state.meals.expenses.length; i++) ensure(state.meals.expenses[i].date);
    for (var wk in state.meals.weeks) {
      if (!Object.prototype.hasOwnProperty.call(state.meals.weeks, wk)) continue;
      w = state.meals.weeks[wk] || {};
      mon = parseYmd(w.start);
      if (!mon) continue;
      for (i = 0; i < DAYS.length; i++) {
        s = (w.days && w.days[DAYS[i].k]) || {};
        if (s.b || s.l || s.d) ensure(ymd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i)));

  function barList(map, unitFmt, cls) {

  function shrinkImage(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          try { resolve(cv.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
        };
        img.onerror = function () { reject(new Error('사진을 열지 못했어요.')); };
        img.src = String(reader.result || '');
      };
      reader.onerror = function () { reject(new Error('사진을 읽지 못했어요.')); };
      reader.readAsDataURL(file);
    });
  }

  async function analyzeReceipt(file) {
    ui.rec = { step: 'busy' };

      if (!getKey()) throw new Error('NO_KEY');
      if (!/^image\//.test(file.type || '')) throw new Error('이미지 파일만 올릴 수 있어요.');
      var dataUrl = await shrinkImage(file, 1400, 0.85);
      var mime = (/^data:(.*?);/.exec(dataUrl) || [])[1] || 'image/jpeg';
      var b64 = dataUrl.split(',')[1];
      var out = await geminiJSON([
        { text: PROMPT_RECEIPT },
        { inline_data: { mime_type: mime, data: b64 } }
      ], SCHEMA_RECEIPT);
      var list = (out && out.items) || [];
      var items = [];
      for (var i = 0; i < list.length && i < 40; i++) {
        var it = list[i] || {};
        var name = String(it.name || '').trim();
        if (!name) continue;
        items.push({
          include: true, name: name.slice(0, 40),
          qty: Math.max(0, num(it.qty) || 1),
          unit: String(it.unit || '개').slice(0, 6),
          storage: normStorage(it.storage),

  /* ---------- Gemini ---------- */
  function msgForError(e) {
    var m = (e && e.message) ? e.message : String(e || '');
    if (m === 'NO_KEY' || m === 'NO_KEY_SET') return '설정에서 Gemini API 키를 먼저 넣어 주세요.';
    if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return 'API 키가 올바르지 않아요. ⚙️ 설정에서 다시 확인해 주세요.';
    if (/quota|RESOURCE_EXHAUSTED|429/i.test(m)) return '무료 사용량을 다 썼어요. 잠시 후 다시 시도해 주세요.';
    if (/네트워크|fetch|Failed to fetch|NetworkError/i.test(m)) return '인터넷에 연결하지 못했어요. 연결을 확인해 주세요.';
    return m || '알 수 없는 오류가 생겼어요.';
  }

  function geminiExtractText(json) {
    try {
      var c = json.candidates && json.candidates[0];
      var parts = (c && c.content && c.content.parts) || [];
      var out = '';
      for (var i = 0; i < parts.length; i++) if (parts[i] && parts[i].text) out += parts[i].text;
      return out;
    } catch (e) { return ''; }
  }
  function looseJson(text) {
    var t = String(text || '').trim();
    t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) t = t.slice(a, b + 1);
    return JSON.parse(t);
  }

  function geminiCacheModel(id) {
    try { if (id) localStorage.setItem(MODEL_CACHE_KEY, id); else localStorage.removeItem(MODEL_CACHE_KEY); } catch (e) {}
  }
  function geminiCachedModel() {
    try { return localStorage.getItem(MODEL_CACHE_KEY) || ''; } catch (e) { return ''; }
  }

  /* 모델 이름이 바뀌어도 죽지 않도록, 실제로 쓸 수 있는 모델 목록을 물어본다. */
  async function geminiListModels(key) {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=' + encodeURIComponent(key);
    var res, json = null;
    try {
      res = await window.fetch(url, { method: 'GET' });
      try { json = await res.json(); } catch (e) { json = null; }
    } catch (e) {
      throw new Error('네트워크에 연결하지 못했어요.');
    }
    if (!res.ok) {
      var em = (json && json.error && json.error.message) ? json.error.message : ('HTTP ' + res.status);
      throw new Error(em);
    }
    var ids = [], list = (json && json.models) || [], i;
    for (i = 0; i < list.length; i++) {
      var m = list[i] || {};
      var id = String(m.name || '').replace(/^models\//, '');
      var methods = m.supportedGenerationMethods || [];
      if (methods.indexOf('generateContent') < 0) continue;
      if (!/^gemini-/.test(id)) continue;
      if (/(image|tts|live|transcribe|embedding|translate|omni|audio|robotics|computer-use|vision-last)/i.test(id)) continue;
      ids.push(id);
    }
    /* 일반 대화용(flash / hydrogen)을 앞으로, 나머지는 뒤로 */
    var pref = [], rest = [];
    for (i = 0; i < ids.length; i++) {
      if (/(flash|hydrogen|pro)/i.test(ids[i])) pref.push(ids[i]); else rest.push(ids[i]);
    }
    return pref.concat(rest);
  }

  function geminiTryOrder(extra) {
    var out = [], seen = {}, i, c = geminiCachedModel();
    var all = (c ? [c] : []).concat(GEMINI_MODELS).concat(extra || []);
    for (i = 0; i < all.length; i++) {
      var id = String(all[i] || '').trim();
      if (!id || seen[id]) continue;
      seen[id] = 1; out.push(id);
    }
    return out;
  }

  async function geminiRequest(key, model, parts, schema) {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
    var cfg = { temperature: 0.25, responseMimeType: 'application/json' };
    if (schema) cfg.responseSchema = schema;
    var body = { contents: [{ role: 'user', parts: parts }], generationConfig: cfg };
    var res, json = null;
    try {
      res = await window.fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify(body)
      });
      try { json = await res.json(); } catch (e) { json = null; }
    } catch (e) {
      throw new Error('네트워크에 연결하지 못했어요.');
    }
    return { res: res, json: json };
  }

  function geminiModelMissing(res, json) {
    var em = (json && json.error && json.error.message) ? String(json.error.message) : '';
    if (res.status === 404) return true;
    if (res.status === 400 && /model|not found|not supported|unsupported/i.test(em)) return true;
    return false;
  }

  async function geminiGenerate(key, model, parts, schema) {
    var r = await geminiRequest(key, model, parts, schema);
    if (geminiModelMissing(r.res, r.json)) return null;
    if (!r.res.ok) {
      var em = (r.json && r.json.error && r.json.error.message) ? r.json.error.message : ('HTTP ' + r.res.status);
      throw new Error(em);
    }
    var text = geminiExtractText(r.json);
    if (!text) {
      var c = r.json && r.json.candidates && r.json.candidates[0];
      var reason = c && c.finishReason;
      throw new Error('응답이 비어 있어요' + (reason ? ' (' + reason + ')' : ''));
    }
    try { return looseJson(text); } catch (e) { throw new Error('응답을 이해하지 못했어요. 다시 시도해 주세요.'); }
  }

  async function geminiJSON(parts, schema) {
    var key = getKey();
    if (!key) throw new Error('NO_KEY');
    var list = geminiTryOrder(), i, out;
    for (i = 0; i < list.length; i++) {
      out = await geminiGenerate(key, list[i], parts, schema);
      if (out) { geminiCacheModel(list[i]); return out; }
    }
    /* 하드코딩한 모델이 모두 사라졌을 때: 사용 가능한 모델을 직접 찾아 한 번 더 시도 */
    var found = await geminiListModels(key);
    var again = geminiTryOrder(found), j;
    for (j = 0; j < again.length; j++) {
      if (list.indexOf(again[j]) >= 0) continue;
      out = await geminiGenerate(key, again[j], parts, schema);
      if (out) { geminiCacheModel(again[j]); return out; }
    }
    throw new Error('이 API 키로 쓸 수 있는 Gemini 모델을 찾지 못했어요. 잠시 후 다시 시도해 주세요.');
  }

  async function refreshAI() {

    if (!getKey()) {
      ui.keyMsg = 'err:AI 추천을 쓰려면 Gemini API 키를 넣어 주세요.';
      renderSettings();
      showModal('settingsModal');
      return;

    ui.aiBusy = true;
    renderRecipes();
    try {
      var stock = inStock(state.inventory.items).map(function (it) { return it.name; });
      var shop = needsShopping().map(function (it) { return it.name; });
      var prompt = '너는 한국 가정의 식단 도우미야. 아래 냉장고 재고로 이번 주 평일 저녁·아침에 만들 수 있는 한국 가정식 레시피를 4개 추천해줘.\n' +
        '재고(보유중): ' + stock.join(', ') + '\n' +
        '지금 없는 단골 재료: ' + (shop.length ? shop.join(', ') : '없음') + '\n' +
        '조건: 1) 재고 재료를 최대한 쓰고, 없어도 사기 쉬운 재료만 missing에 적기 2) 조리 30분 이내 3) 아이도 먹을 수 있는 순한 맛 위주 4) 각 레시피에 title, reason(한 줄), minutes(숫자), ingredients(재료 배열), missing(지금 없는 재료 배열), steps(조리 순서 4단계 이내 배열)를 채우기.';
      var out = await geminiJSON([{ text: prompt }], SCHEMA_RECIPES);
      var list = (out && out.recipes) || [];
      var clean = [];
      for (var i = 0; i < list.length && i < 6; i++) {
        var r = list[i] || {};
        if (!r.title) continue;
        clean.push({
          title: String(r.title).slice(0, 60),
          reason: String(r.reason || '').slice(0, 160),
          minutes: Math.max(0, Math.round(num(r.minutes))),
          ingredients: (r.ingredients || []).slice(0, 14).map(function (x) { return String(x).slice(0, 30); }),
          missing: (r.missing || []).slice(0, 10).map(function (x) { return String(x).slice(0, 30); }),
          steps: (r.steps || []).slice(0, 8).map(function (x) { return String(x).slice(0, 160); })
        });
      }
      if (!clean.length) throw new Error('추천을 받지 못했어요. 다시 시도해 주세요.');
      state.settings.recipes = clean;
      state.settings.recipesAt = nowIso();
      markDirty('settings');
      toast('✨ AI 추천 식단을 업데이트했어요');
    } catch (e) {
      toast(msgForError(e), true);
    } finally {
      ui.aiBusy = false;
      renderRecipes();
    }
  }

  /* ============ 게이트 ============ */
  function showGate(mode, msg) {
    $('appRoot').hidden = true;
    $('gateScreen').hidden = false;
    ui.gateMode = mode || '';
    var note = $('gateMsg');
    if (note) note.textContent = msg || (mode === 'setup'
      ? '아직 이 기기가 저장소에 연결되지 않았어요. 가족 허브에서 한 번만 연결해 주세요.'
      : '가족 허브에서 로그인하면 여기서도 바로 이어서 쓸 수 있어요.');
  }

  function wireGate() {
    var form = $('gateForm');
    if (form) form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var msg = $('gMsg');
      var owner = fieldVal('gOwner').trim(), repo = fieldVal('gRepo').trim(), token = fieldVal('gToken').trim();
      function fail(t) { if (msg) { msg.className = 'gate-msg'; msg.textContent = t; } }
      if (!owner || !repo || !token) return fail('아이디, 저장소, 토큰을 모두 넣어 주세요.');
      if (!/^(gh[pousr]_|github_pat_)/.test(token)) return fail('GitHub 토큰 형식이 아니에요. (github_pat_… )');
      var btn = $('gBtn'); if (btn) { btn.disabled = true; btn.textContent = '연결하는 중…'; }
      try {
        var res = await window.fetch(API_BASE + '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo), { headers: ghHeaders(token), cache: 'no-store' });
        if (res.status === 401) return fail('토큰이 올바르지 않아요.');
        if (res.status === 404) return fail('저장소를 찾을 수 없어요. 아이디·저장소 이름을 확인해 주세요.');
        if (!res.ok) return fail('저장소를 확인하지 못했어요. (HTTP ' + res.status + ')');
        var info = await res.json();
        if (info && info.private === false) return fail('비공개(private) 저장소만 연결할 수 있어요.');
        if (info && info.permissions && info.permissions.push === false) return fail('토큰에 쓰기 권한이 없어요. Contents를 Read and write로 주세요.');
        saveDevice({ owner: owner, repo: repo, token: token, branch: 'main', at: Date.now() });
        if (msg) { msg.className = 'gate-msg ok'; msg.textContent = '연결했어요! 가족 허브에서 비밀번호로 로그인한 뒤 이 화면을 새로고침해 주세요.'; }
      } catch (err) {
        fail('연결에 실패했어요. 인터넷 연결을 확인해 주세요.');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '연결하기'; }
      }
    });
  }

  /* ============ 부팅 ============ */
  async function boot() {
    cloud.sha = loadShaCache();
    var local = loadLocal();
    if (local) hydrateLocal(local);
    cloud.conn = loadDevice();
    renderSyncPill();
    if (!cloud.conn) { showGate('setup'); return; }
    var sess = loadSession();
    if (!sess) { showGate('login'); return; }
    var res = null;
    try { res = await ghGet('config/users.json'); } catch (e) { res = null; }
    if (res && res.status === 401) {
      showGate('login', '토큰이 만료됐어요. 가족 허브에서 기기를 다시 연결해 주세요.');
      return;
    }
    if (res && res.ok && res.data && Object.prototype.toString.call(res.data.users) === '[object Array]') {
      cloud.users = res.data;
      var u = findUser(sess.id);
      if (!u) {
        lsDel(SESSION_KEY); ssDel(SESSION_KEY);
        showGate('login', '계정 정보를 찾을 수 없어요. 가족 허브에서 다시 로그인해 주세요.');
        return;
      }
      cloud.me = { id: u.id, name: u.name || u.id, role: ROLES[u.role] ? u.role : 'viewer' };
      cloud.session = sess;
    } else {
      /* 오프라인이거나 계정 파일이 없을 때: 기기에 저장된 세션으로 계속 */
      cloud.me = { id: sess.id, name: sess.name, role: sess.role };
      cloud.session = sess;
    }
    enterApp();
  }

  function enterApp() {
    lsSet(HUB_LAST_KEY, 'fridge'); /* 가족 허브(/home/)의 '최근 사용' 표시용 */

  async function loadRemote() {
    if (!cloud.conn || !cloud.me) return;
    setSync('syncing');
    var r = await Promise.all([ghGet(PATH_INV), ghGet(PATH_MEALS), ghGet(PATH_SET), ghGet(PATH_DAILY)]);
    var okAll = true;

    if (r[0].ok && r[0].data && !cloud.dirty.inventory) {
      state.inventory = normalizeInventory(r[0].data);
    } else if (r[0].ok && r[0].missing) {
      if (!cloud.dirty.inventory) {
        if (!state.inventory.items.length) state.inventory = seedInventory();
        cloud.dirty.inventory = true;
      }
    } else if (!r[0].ok) { okAll = false; }

    if (r[1].ok && r[1].data && !cloud.dirty.meals) state.meals = normalizeMeals(r[1].data);
    else if (r[1].ok && r[1].missing) cloud.dirty.meals = true;
    else if (!r[1].ok) okAll = false;

    if (r[2].ok && r[2].data && !cloud.dirty.settings) state.settings = normalizeSettings(r[2].data);
    else if (r[2].ok && r[2].missing) cloud.dirty.settings = true;
    else if (!r[2].ok) okAll = false;

    if (r[3].ok && r[3].data && !cloud.dirty.daily) state.daily = normalizeDaily(r[3].data);
    else if (r[3].ok && r[3].missing) cloud.dirty.daily = true;
    else if (!r[3].ok) okAll = false;

    try { backfillDaily(); } catch (e) { /* 기록 백필 실패는 무시 */ }

    saveLocal();
    renderAll();
    if (!okAll) setSync(navigator.onLine === false ? 'offline' : 'error');
    else if (anyDirty()) { setSync('syncing'); scheduleSync(); }
    else setSync('ok');
  }

  /* ============ 이벤트 ============ */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id') || '';

    if (act === 'modal-close') { closeModal(el.getAttribute('data-m') || ''); return; }
    if (act === 'tab-set') { setTab(el.getAttribute('data-tab') || 'all'); return; }
    if (act === 'edit-toggle') { toggleEdit(); return; }
    if (act === 'sec-up') { moveSection(el.getAttribute('data-sec'), -1); return; }
    if (act === 'sec-down') { moveSection(el.getAttribute('data-sec'), 1); return; }
    if (act === 'history-open') { openHistory(); return; }
    if (act === 'stats-open') { openStats(); return; }
    if (act === 'hist-prev') { histShift(-1); return; }
    if (act === 'hist-next') { histShift(1); return; }
    if (act === 'hist-day') { ui.histSel = el.getAttribute('data-key') || ui.histSel; renderHistory(); return; }
    if (act === 'history-backup') {
      downloadJson('fridge-backup-' + todayStr() + '.json', { inventory: state.inventory, meals: state.meals, settings: state.settings, daily: state.daily });
      return;
    }
    if (act === 'watch-add') { openWatchModal(''); return; }
    if (act === 'watch-edit') { openWatchModal(id); return; }
    if (act === 'watch-save') { saveWatch(); return; }
    if (act === 'watch-del') { deleteWatch(id); return; }
    if (act === 'watch-alert') { toggleWatchAlert(id); return; }
    if (act === 'watch-toggle') { ui.watchOpen = !ui.watchOpen; renderShopping(); applyTab(); return; }
    if (act === 'recipe-link') { openLinkModal(el.getAttribute('data-kind') || 'b', el.getAttribute('data-title') || ''); return; }
    if (act === 'link-save') { saveLinks(); return; }
    if (act === 'link-clear') {
      if (state.settings.links) delete state.settings.links[ui.linkKey];
      markDirty('settings'); closeModal('linkModal'); renderRecipes(); toast('링크를 지웠어요');
      return;
    }
    if (act === 'gate-connect') {
      var f = $('gateForm');
      if (f) { f.hidden = !f.hidden; if (!f.hidden) { try { $('gToken').focus(); } catch (er) { /* 무시 */ } } }
      return;
    }

    if (act === 'settings-open') { ui.keyMsg = ''; renderSettings(); showModal('settingsModal'); return; }
    if (act === 'item-add') { openItemModal(''); return; }
    if (act === 'item-save') { saveItem(); return; }
    if (act === 'item-edit') { openItemModal(id); return; }
    if (act === 'item-del') {
      var it = findItem(id); if (!it) return;
      if (!window.confirm('"' + it.name + '" 를 목록에서 지울까요?')) return;
      state.inventory.items = state.inventory.items.filter(function (x) { return x.id !== id; });
      markDirty('inventory'); renderAll(); toast('🗑️ ' + it.name + ' 삭제했어요');
      return;
    }
    if (act === 'qty-up' || act === 'qty-down') {
      var q = findItem(id); if (!q) return;
      var before = num(q.qty);
      q.qty = Math.max(0, before + (act === 'qty-up' ? 1 : -1));
      q.status = q.qty > 0 ? 'in' : 'out';
      q.updatedAt = Date.now();
      if (act === 'qty-down' && before > q.qty) logDaily('consumed', q, before - q.qty);
      markDirty('inventory'); renderAll();
      return;
    }
    if (act === 'item-out' || act === 'item-restock') {
      var o = findItem(id); if (!o) return;
      if (act === 'item-out') {
        logDaily('consumed', o, num(o.qty) || 1);
        o.qty = 0; o.status = 'out'; o.updatedAt = Date.now();
        markDirty('inventory'); renderAll(); toast('다 먹었어요 · ' + o.name);
      } else {
        o.qty = Math.max(1, num(o.minQty) || 1);
        o.status = 'in';
        o.boughtAt = todayStr();
        o.updatedAt = Date.now();
        logDaily('bought', o, num(o.qty));
        markDirty('inventory'); renderAll(); toast('🛒 ' + o.name + ' 재입고 완료!');
      }
      return;
    }
    if (act === 'item-staple') {
      var st = findItem(id); if (!st) return;
      st.staple = !st.staple;
      if (st.staple) st.alert = true;
      if (st.staple && !st.minQty) st.minQty = 1;
      st.updatedAt = Date.now();
      markDirty('inventory'); renderAll();
      toast(st.staple ? '★ ' + st.name + ' 알림 재료로 표시했어요' : st.name + ' 알림 해제');
      return;
    }
    if (act === 'st-toggle') {
      var key = el.getAttribute('data-st');
      ui.storages[key] = !ui.storages[key];
      renderTools(); renderInventory();
      return;
    }
    if (act === 'shop-toggle') { ui.shopOpen = !ui.shopOpen; renderShopping(); return; }
    if (act === 'status-set') {
      ui.status = el.getAttribute('data-st');
      renderTools(); renderInventory();
      return;
    }
    if (act === 'filter-reset') {
      ui.search = '';
      ui.storages = { frozen: true, fridge: true, room: true, sauce: true };
      ui.status = 'in'; ui.sort = 'new';
      renderTools(); renderInventory();
      return;
    }
    if (act === 'recipe-toggle') { ui.recipeAll = !ui.recipeAll; renderRecipes(); return; }
    if (act === 'ai-refresh') { refreshAI(); return; }

    if (act === 'receipt-open') { openReceipt(); return; }
    if (act === 'receipt-pick') {
      var rf = $('receiptFile');
      if (rf) rf.click();
      return;
    }
    if (act === 'receipt-add') { addReviewed(); return; }

    if (act === 'key-save') {
      var kv = fieldVal('keyInput').trim();
      if (!kv) { ui.keyMsg = 'err:키를 입력해 주세요.'; renderSettings(); return; }
      lsSet(KEY_KEY, kv);
      ui.keyMsg = 'ok:키를 이 브라우저에 저장했어요. GitHub에는 올라가지 않아요.';
      renderSettings(); renderRecipes();
      return;
    }
    if (act === 'key-clear') {
      lsDel(KEY_KEY);
      ui.keyMsg = 'ok:키를 지웠어요.';
      renderSettings(); renderRecipes();
      return;
    }
    if (act === 'key-check') { checkKey(); return; }
    if (act === 'budget-save') {
      if (ui.readOnly) { toast('보기 전용 계정이에요.', true); return; }
      var b = Math.max(0, Math.round(num(fieldVal('budgetInput'))));
      if (!b) { toast('목표 금액을 넣어 주세요.', true); return; }
      state.meals.budget = b;
      markDirty('meals'); renderAll(); renderSettings();
      toast('💰 월 식비 목표를 ' + fmtWon(b) + '원으로 저장했어요');
      return;
    }
    if (act === 'sync-now') { flushSync(); toast('☁️ 동기화를 시작했어요'); return; }
    if (act === 'reload-data') {
      if (anyDirty()) { toast('저장하지 않은 변경이 있어요. 잠시 뒤 다시 시도해 주세요.', true); return; }
      loadRemote(); toast('GitHub에서 다시 불러오는 중…');
      return;
    }

    if (act === 'meal-edit') {
      if (ui.readOnly) { toast('보기 전용 계정이에요.', true); return; }
      openMealModal(el.getAttribute('data-day') || '');
      return;
    }
    if (act === 'meal-save') { saveMeal(); return; }
    if (act === 'week-prev' || act === 'week-next') {
      var d0 = parseYmd(ui.weekStart) || new Date();
      var d1 = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + (act === 'week-next' ? 7 : -7));
      ui.weekStart = ymd(mondayOf(d1));
      renderMeals();
      return;
    }
    if (act === 'week-today') { ui.weekStart = ymd(mondayOf(new Date())); renderMeals(); return; }

    if (act === 'expense-open') { renderExpense(); showModal('expenseModal'); return; }
    if (act === 'expense-save') {
      var amount = Math.max(0, Math.round(num(fieldVal('exAmount'))));
      if (!amount) { toast('금액을 넣어 주세요.', true); return; }
      var exDate = isYmd(fieldVal('exDate')) ? fieldVal('exDate') : todayStr();
      state.meals.expenses.push({
        id: uid('ex'),
        date: exDate,
        amount: amount,
        note: fieldVal('exNote').slice(0, 40),
        createdAt: Date.now()
      });
      touchDate(exDate);
      markDirty('meals'); renderAll(); renderExpense();
      toast('💰 ' + fmtWon(amount) + '원 기록했어요');
      return;
    }
    if (act === 'expense-del') {
      var delEx = null;
      for (var xi = 0; xi < state.meals.expenses.length; xi++) if (state.meals.expenses[xi].id === id) { delEx = state.meals.expenses[xi]; break; }
      state.meals.expenses = state.meals.expenses.filter(function (x) { return x.id !== id; });
      if (delEx) touchDate(delEx.date);
      markDirty('meals'); renderAll(); renderExpense();
      return;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'searchInput') {
      ui.search = t.value;
      renderInventory();
      return;
    }
    if (t.id === 'sortSel') return;
    if (t.hasAttribute && t.hasAttribute('data-ri') && ui.rec && ui.rec.step === 'review') {
      var i = parseInt(t.getAttribute('data-ri'), 10);
      var f = t.getAttribute('data-f');
      var item = ui.rec.items[i];
      if (!item || !f) return;
      item[f] = (f === 'qty' || f === 'price') ? num(t.value) : t.value;
      if (f !== 'name') { /* 이름 수정 중엔 목록을 다시 그리지 않음 */ }
      var cnt = $('recCount');
      if (cnt) {
        var n = 0;
        for (var k = 0; k < ui.rec.items.length; k++) if (ui.rec.items[k].include) n++;
        cnt.textContent = n + '개 선택';
      }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.classList && t.classList.contains('so-title')) {
      var sk = t.getAttribute('data-sec') || '';
      if (SEC_KEYS.indexOf(sk) < 0) return;
      var sv = String(t.value || '').replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!state.settings.sectionTitles) state.settings.sectionTitles = {};
      if (sv && sv !== secDefaultName(sk)) state.settings.sectionTitles[sk] = sv;
      else delete state.settings.sectionTitles[sk];
      markDirty('settings');
      renderAll();
      return;
    }
    if (t.id === 'sortSel') { ui.sort = t.value; renderTools(); renderInventory(); return; }
    if (t.id === 'receiptFile' && t.files && t.files[0]) {
      var f = t.files[0];
      analyzeReceipt(f);
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-ri') && ui.rec && ui.rec.step === 'review') {
      var i = parseInt(t.getAttribute('data-ri'), 10);
      var item = ui.rec.items[i];
      if (!item) return;
      if (t.type === 'checkbox') {
        item.include = t.checked;
        var row = t.closest('.rec-row');
        if (row) row.className = 'rec-row' + (item.include ? '' : ' off');
        var cnt = $('recCount');
        if (cnt) {
          var n = 0;
          for (var k = 0; k < ui.rec.items.length; k++) if (ui.rec.items[k].include) n++;
          cnt.textContent = n + '개 선택';
        }
        return;
      }
      var f = t.getAttribute('data-f');
      if (f === 'storage') item.storage = normStorage(t.value);
      if (f === 'qty' || f === 'price') item[f] = num(t.value);
      if (f === 'name' || f === 'unit') item[f] = t.value;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.key !== 'Esc') return;
    var sheets = document.querySelectorAll('.sheet:not([hidden])');
    if (sheets.length) closeModal(sheets[sheets.length - 1].id);
  });

  document.addEventListener('click', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('sheet')) {
      closeModal(e.target.id);
    }
  });

  window.addEventListener('online', function () {
    if (cloud.me && anyDirty()) flushSync();
    else if (cloud.me && (cloud.status === 'offline' || cloud.status === 'error')) loadRemote();
  });
  window.addEventListener('visibilitychange', function () {
    if (!document.hidden && cloud.me && anyDirty()) flushSync();
  });
  window.setInterval(function () {
    if (cloud.me && anyDirty() && navigator.onLine !== false) flushSync();
  }, 15000);

  /* ============ 시작 ============ */
  wireGate();
  boot();
})();
</script>
</body>
</html>
